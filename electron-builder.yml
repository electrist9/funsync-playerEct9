# Ect9 fork: distinct appId + productName so this build never collides with
# (or upgrades over) an installed upstream FunSync Player on the same machine.
appId: com.funsync.player.ect9
productName: FunSync Player Ect9
copyright: Copyright © 2026

# serialport's native binding (@serialport/bindings-cpp) ships N-API prebuilds
# — ABI-stable across Node AND Electron, loaded at runtime via node-gyp-build —
# so it NEVER needs a from-source rebuild. Skip electron-builder's default
# rebuild: it required Visual Studio / node-gyp on the Windows CI runner and
# failed the v0.8.0 build ("Could not find any Visual Studio installation to
# use"). Linux built fine either way; this makes Windows use the prebuild too.
npmRebuild: false
# Native .node prebuilds can't be dlopen'd from inside the asar — keep them
# unpacked so node-gyp-build can load them at runtime.
asarUnpack:
  - "**/*.node"

directories:
  output: dist

files:
  - electron/**/*
  - renderer/**/*
  - node_modules/**/*
  - package.json

extraResources:
  # PyInstaller onedir output folder (funsync-backend.exe + _internal/).
  # Its CONTENTS land directly in resources/backend/, so python-bridge's
  # `resources/backend/funsync-backend.exe` path is unchanged from onefile.
  - from: backend-dist/funsync-backend
    to: backend
    filter:
      - "**/*"

# Injects the FunSync-portable.txt marker (next to the exe) into the win zip
# artifact — the only artifact this fork ships. See scripts/after-all-artifact-build.js.
afterAllArtifactBuild: scripts/after-all-artifact-build.js

win:
  icon: assets/icons/icon.ico
  # The exe name ONLY (productName keeps its space for Start menu / shortcuts).
  executableName: FunSyncPlayerEct9
  # Ect9 fork ships the portable zip ONLY — no NSIS installer. The zip is a
  # plain compressed copy of the onedir win-unpacked folder (the marker file
  # is injected by afterAllArtifactBuild), and main.js opts it into portable
  # data (data/ next to the exe) via FunSync-portable.txt. There is NO
  # single-exe `portable` target: electron-builder's portable .exe is a
  # self-extractor that unpacks to a per-build UUID temp dir (pinning
  # unpackDirName makes two running instances share a temp dir and the
  # second one's exit corrupts the first — SCOPE-portable-install.md §7),
  # which is neither a real onedir layout nor AV-friendly.
  target:
    - target: zip
      arch: x64
  # ffmpeg beside the backend exe (resources/backend/ffmpeg.exe), which is
  # exactly where services/ffmpeg.py's frozen `_find_binary` branch looks
  # (dirname(sys.executable)). Previously these sat at the content root
  # (resources/ffmpeg/), which the backend never resolved — it silently
  # fell back to PATH.
  extraResources:
    - from: ffmpeg/
      to: backend
      filter:
        - ffmpeg.exe
        - ffprobe.exe
  # Dash-based, space-free name (GitHub rewrites spaces in asset names).
  # `-win-x64` marks the platform. NOTE: electron-builder 25's schema has NO
  # top-level `zip:` section — the zip target has no dedicated config block —
  # so the zip's name lives here at the win level.
  artifactName: FunSyncPlayerEct9-${version}-win-x64.${ext}

linux:
  icon: assets/icons/icon.png
  category: Video
  # Override the binary name so the AppImage doesn't carry a space (the
  # default derives from `productName` -> "FunSync Player.AppImage",
  # which is awkward to launch from a shell without quoting). The
  # in-app productName "FunSync Player" is preserved for the desktop
  # entry / menu label.
  executableName: funsync-player
  # Space-free AppImage name so it matches latest-linux.yml (same spaces →
  # dashes vs GitHub dots mismatch as the Windows installer had).
  artifactName: FunSync-Player-${version}.${ext}
  target:
    - target: AppImage
      arch: x64
  desktop:
    Name: FunSync Player
    Comment: Video player with device integration for synchronized funscript playback
  # Same as Windows: ffmpeg next to the backend exe so the frozen
  # `_find_binary` branch (dirname(sys.executable)) finds it.
  extraResources:
    - from: ffmpeg-linux/
      to: backend
      filter:
        - ffmpeg
        - ffprobe

asar: true
