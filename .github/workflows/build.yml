name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      # Ect9 fork ships Windows portable-zip ONLY — the upstream Linux
      # (AppImage) matrix entry was removed. The linux: section in
      # electron-builder.yml is kept inert for reference.
      matrix:
        include:
          - os: windows-latest
            target: win
            python: python

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node dependencies
        run: npm ci

      - name: Run JS tests
        run: npx vitest run

      - name: Setup Python backend
        run: |
          cd backend
          ${{ matrix.python }} -m venv .venv
          ${{ matrix.os == 'windows-latest' && '.venv\\Scripts\\pip' || '.venv/bin/pip' }} install -r requirements.txt
          ${{ matrix.os == 'windows-latest' && '.venv\\Scripts\\python' || '.venv/bin/python' }} -m pytest -v

      - name: Build Python backend with PyInstaller
        run: |
          cd backend
          ${{ matrix.os == 'windows-latest' && '.venv\\Scripts\\pip' || '.venv/bin/pip' }} install pyinstaller
          ${{ matrix.os == 'windows-latest' && '.venv\\Scripts\\python' || '.venv/bin/python' }} -m PyInstaller --distpath ../backend-dist --workpath ../build/pyinstaller --clean funsync-backend.spec

      # Prove the executable exists before packaging. PyInstaller can exit 0
      # without leaving anything at the expected path, and electron-builder
      # copies an empty extraResources folder without complaint — so the
      # failure mode is a green build that ships an installer with no backend
      # and every user seeing "Backend program is missing". It would never be
      # caught locally either, because in development app.isPackaged is false
      # and the app runs the backend from the venv instead.
      - name: Verify backend executable was produced
        shell: bash
        run: |
          EXE="backend-dist/funsync-backend/funsync-backend"
          [ "${{ matrix.os }}" = "windows-latest" ] && EXE="backend-dist/funsync-backend/funsync-backend.exe"
          if [ ! -f "$EXE" ]; then
            echo "FATAL: $EXE missing after a successful PyInstaller run."
            echo "Contents of backend-dist/:"
            ls -la backend-dist/ || echo "  (directory does not exist)"
            exit 1
          fi
          SIZE=$(wc -c < "$EXE")
          if [ "$SIZE" -lt 1000000 ]; then
            echo "FATAL: $EXE is only $SIZE bytes — not a real build."
            exit 1
          fi
          # onedir: the exe is a thin bootloader; everything else lives in
          # the sibling _internal/. An exe without it cannot start.
          if [ ! -d "backend-dist/funsync-backend/_internal" ]; then
            echo "FATAL: backend-dist/funsync-backend/_internal missing — incomplete onedir bundle."
            exit 1
          fi
          echo "OK: $EXE ($SIZE bytes) + _internal/"

      # Category-icon artwork (Twemoji, ~737 SVGs / 2.7 MB). Gitignored and
      # fetched here, same treatment as ffmpeg below — it is generated
      # third-party art, and committing it would add another copy to history
      # every time the catalogue is regenerated. A missing SVG degrades to
      # font rendering rather than breaking, so this failing is cosmetic, but
      # cosmetic-and-silent is exactly what bundling them was meant to fix.
      - name: Fetch Twemoji artwork
        run: node scripts/fetch-twemoji.mjs

      - name: Verify emoji artwork was fetched
        shell: bash
        run: |
          COUNT=$(ls -1 renderer/assets/emoji/*.svg 2>/dev/null | wc -l)
          if [ "$COUNT" -lt 100 ]; then
            echo "FATAL: only $COUNT emoji SVGs fetched."
            exit 1
          fi
          echo "OK: $COUNT emoji SVGs"

      - name: Download ffmpeg (Linux)
        if: matrix.os == 'ubuntu-latest'
        # Source: BtbN/FFmpeg-Builds. Hosted on GitHub's own CDN so
        # GitHub Actions runners never hit a cloud-IP rate limit (which
        # killed the johnvansickle.com mirror twice during 0.8.0-experimental.0).
        # `latest` tag tracks the current release ffmpeg; the master
        # variant tracks tip-of-master. We want the release variant for
        # stability. `--tries=3 --waitretry=5` adds belt-and-suspenders
        # retries for transient blips.
        run: |
          mkdir -p ffmpeg-linux
          # Pinned to the 8.1 release line to match the Windows bundle
          # (memory: "ffmpeg 8.1 bundled in ffmpeg/ directory"). When
          # bumping the project to a newer ffmpeg version, update both
          # the Windows bundle and this URL together.
          wget --tries=3 --waitretry=5 -q \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz \
            -O ffmpeg-linux.tar.xz
          tar xf ffmpeg-linux.tar.xz --strip-components=1 -C ffmpeg-linux
          # BtbN bundles binaries under bin/ — flatten to match the
          # previous layout so electron-builder / runtime _find_binary
          # logic doesn't need to know about the source change.
          if [ -d ffmpeg-linux/bin ]; then
            mv ffmpeg-linux/bin/ffmpeg ffmpeg-linux/ffmpeg
            mv ffmpeg-linux/bin/ffprobe ffmpeg-linux/ffprobe
          fi
          chmod +x ffmpeg-linux/ffmpeg ffmpeg-linux/ffprobe

      - name: Build Electron app
        # --publish never: electron-builder ONLY builds here. The Ect9 fork
        # removed the `publish:` block entirely (auto-update is disabled), so
        # this flag is belt-and-braces insurance against a stray publish /
        # draft-release creation on tag builds.
        run: npx electron-builder --config electron-builder.yml --${{ matrix.target }} --publish never

      # And prove it survived INTO the package. The step above can succeed
      # with an empty extraResources copy, so verifying the source file
      # existed is not the same as verifying it shipped. onedir: the exe
      # AND the sibling _internal/ must both be in resources/backend/.
      - name: Verify backend shipped inside the package
        shell: bash
        run: |
          FOUND=0
          for DIR in dist/win-unpacked/resources/backend dist/linux-unpacked/resources/backend; do
            [ -d "$DIR" ] || continue
            COUNT=$(ls -1 "$DIR" | wc -l)
            if [ "$COUNT" -eq 0 ]; then
              echo "FATAL: $DIR is EMPTY — this installer has no backend."
              exit 1
            fi
            case "$DIR" in
              *win-unpacked*) BEXE="$DIR/funsync-backend.exe" ;;
              *)              BEXE="$DIR/funsync-backend" ;;
            esac
            if [ ! -f "$BEXE" ]; then
              echo "FATAL: $BEXE missing in $DIR — packaged app would show 'Backend program is missing'."
              exit 1
            fi
            if [ ! -d "$DIR/_internal" ]; then
              echo "FATAL: $DIR/_internal missing — incomplete onedir bundle shipped."
              exit 1
            fi
            echo "OK: $DIR contains $COUNT file(s) incl. backend exe + _internal/"
            FOUND=1
          done
          if [ "$FOUND" -eq 0 ]; then
            echo "FATAL: no unpacked output contained resources/backend/."
            echo "extraResources did not copy. Do NOT publish this build."
            find dist -maxdepth 3 -type d | head -30
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: funsync-${{ matrix.target }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.AppImage
            dist/*.yml
            dist/*.blockmap

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/funsync-win/*.zip
            artifacts/funsync-win/*.blockmap
          draft: false
          # Auto-detect pre-release from the tag name. Any semver suffix
          # (e.g. v0.8.0-experimental.0, v1.0.0-rc.1) marks the GitHub
          # release as a pre-release, which electron-updater respects by
          # default — stable users on `latest` channel won't auto-update
          # to it unless they explicitly opt into pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
